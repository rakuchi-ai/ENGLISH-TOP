<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語学習用アプリポータル</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #e2e8f0;
            --radius: 12px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.025em;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border-color: var(--primary);
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin: 0 0 16px 0;
            color: var(--text-main);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--primary);
        }

        .card-footer span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s ease;
        }

        .card:hover .card-footer span {
            transform: translateX(4px);
        }

        footer.site-footer {
            text-align: center;
            margin-top: 50px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>English Learning Apps</h1>
            <p class="subtitle">English Department Portal</p>
        </header>

        <div class="grid">
            <!-- ① 前置詞強化 -->
            <a href="https://rakuchi-ai.github.io/Preposition100/" class="card">
                <h2 class="card-title">前置詞強化</h2>
                <div class="card-footer">
                    <span>アプリを開く</span> &rarr;
                </div>
            </a>

            <!-- ② 接続詞強化 -->
            <a href="https://rakuchi-ai.github.io/conjunction100/" class="card">
                <h2 class="card-title">接続詞強化</h2>
                <div class="card-footer">
                    <span>アプリを開く</span> &rarr;
                </div>
            </a>

            <!-- ③ 入門英文問題精講フラッシュカード -->
            <a href="https://rakuchi-ai.github.io/Nyumon-Eibun/" class="card">
                <h2 class="card-title">入門英文問題精講フラッシュカード</h2>
                <div class="card-footer">
                    <span>アプリを開く</span> &rarr;
                </div>
            </a>

            <!-- ④ イディオム500 -->
            <a href="https://rakuchi-ai.github.io/idiom500/" class="card">
                <h2 class="card-title">イディオム500</h2>
                <div class="card-footer">
                    <span>アプリを開く</span> &rarr;
                </div>
            </a>

            <!-- ⑤ 英文法教室 -->
            <a href="https://rakuchi-ai.github.io/Eibunpo-Kyoshitsu/" class="card">
                <h2 class="card-title">英文法教室</h2>
                <div class="card-footer">
                    <span>アプリを開く</span> &rarr;
                </div>
            </a>

            <!-- ⑥ 正誤問題強化100 -->
            <a href="https://rakuchi-ai.github.io/Error-Recognition/" class="card">
                <h2 class="card-title">正誤問題強化100</h2>
                <div class="card-footer">
                    <span>アプリを開く</span> &rarr;
                </div>
            </a>

            <!-- 中級整序問題 -->
            <a href="https://rakuchi-ai.github.io/WordOrder20/" class="card">
                <h2 class="card-title">中級整序問題</h2>
                <div class="card-footer">
                    <span>アプリを開く</span> &rarr;
                </div>
            </a>
        </div>

        <footer class="site-footer">
            &copy; English Apps Portal
        </footer>
    </div>

</body>
</html>
