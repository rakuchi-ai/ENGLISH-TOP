<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語学習ポータルサイト</title>
    
    <!-- Google FontsからUD系フォント（BIZ UDPGothic）を読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --primary: #3b82f6;
            --shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.08);
            --hover-shadow: 0 20px 40px 0 rgba(59, 130, 246, 0.15);
            --base-font: "UD Digi Kyokasho N-R", "UD Digital Kyokasho NK-R", "BIZ UDPGothic", "メイリオ", Meiryo, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
                --card-bg: rgba(30, 41, 59, 0.65);
                --card-border: rgba(255, 255, 255, 0.1);
                --text-main: #f8fafc;
                --text-sub: #94a3b8;
                --primary: #60a5fa;
                --shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.3);
                --hover-shadow: 0 20px 40px 0 rgba(96, 165, 250, 0.2);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--base-font);
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 50px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1050px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text-main), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1rem;
            margin: 0;
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background-color: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            text-decoration: none;
            color: inherit;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--hover-shadow);
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-icon {
            font-size: 1.5rem;
            background: rgba(59, 130, 246, 0.1);
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
            line-height: 1.4;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            padding-top: 15px;
            border-top: 1px solid rgba(100, 116, 139, 0.15);
        }

        .card-footer span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s ease;
        }

        .card:hover .card-footer span {
            transform: translateX(4px);
        }

        footer.site-footer {
            text-align: center;
            margin-top: 60px;
            font-size: 0.85rem;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">

            <p class="subtitle">暁星高校英語科</p>
        </header>

        <div class="grid">
            <!-- ① 前置詞強化 -->
            <a href="https://rakuchi-ai.github.io/Preposition100/" class="card">

            <!-- ⑤ 英文法教室 -->

            <!-- ⑥ 正誤問題強化100 -->

                </div>
            </a>

            <!-- ⑦ 中級整序問題 -->

                <div class="card-footer">

                </div>
            </a>

             <!-- ⑧ VINTAGE特訓 -->
            <a href="https://rakuchi-ai.github.io/VINTAGE/" class="card">
                <div>
                    <div class="card-header">
                        <h2 class="card-title">VINTAGE特訓</h2>
                        <div class="card-icon">✍️</div>
                    </div>
                </div>
                <div class="card-footer">
                    <span>アプリを開く</span> &rarr;
                </div>
            </a>
        </div>

        <footer class="site-footer">
            &copy; Makoto Kitamura
        </footer>
    </div>

</body>
</html>
